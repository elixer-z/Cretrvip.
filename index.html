<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070707">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cretrvip – Influencer marketing app</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#070707;--ink:#F4F3F0;--muted:#9C9A9A;--card:#131313;--line:#2A2A2A;--acc:#FF8FC7;--on-acc:#14081A;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#FAF9F7;--ink:#141414;--muted:#5F5D5D;--card:#fff;--line:#E2E0DC;--acc:#D6368F;--on-acc:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#FAF9F7;--ink:#141414;--muted:#5F5D5D;--card:#fff;--line:#E2E0DC;--acc:#D6368F;--on-acc:#fff;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
header{padding:26px 0 8px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.03em}.logo i{color:var(--acc);font-style:normal}
h1{font-weight:800;font-size:clamp(32px,8vw,52px);line-height:1;letter-spacing:-.04em;margin:14px 0 10px}
.sub{color:var(--muted);margin:0 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:22px}
.lbl{display:block;font-weight:600;font-size:15px;margin:0 0 8px}
.grp{margin-bottom:18px}.grp:last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:600 15px inherit;font-family:inherit;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.bud{display:flex;justify-content:space-between;align-items:baseline}.bud b{font-size:22px}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 12px}
.cr{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:52px 1fr auto;gap:4px 14px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#14081A;grid-row:span 2}
.cr h3{margin:0;font-size:18px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px}
.sc{text-align:right;font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1}.sc small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.price{font-weight:600}
.btn{border-radius:999px;padding:10px 18px;font:600 15px/1 inherit;font-family:inherit;border:1px solid var(--acc);background:var(--acc);color:var(--on-acc);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.empty{color:var(--muted);padding:12px 0}
.sl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sl:last-of-type{border-bottom:0}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin:14px 0}
.tabs{display:flex;gap:8px;margin:0 0 20px}
.tabs button{flex:1;font:600 16px inherit;font-family:inherit;padding:12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
[hidden]{display:none!important}
.ch{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.in,select{font:inherit;font-family:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.ch .in{flex:1;font-weight:800;font-size:18px}
.bgt{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:14px}
.bgt .in{width:120px}
.cl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.warn{color:#E5484D;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header><span class="logo">Cretrvip<i>.</i></span>
<h1>Run influencer campaigns, start to finish.</h1>
<p class="sub">Match creators to your brand, shortlist them, then track each campaign from brief to payment. Creators shown are samples.</p></header>
<div class="tabs" role="group" aria-label="Sections"><button id="tm" aria-pressed="true">Match</button><button id="tc" aria-pressed="false">Campaigns</button></div>

<div id="vMatch">
<div class="panel">
  <div class="grp"><span class="lbl" id="l1">Your niche</span><div class="chips" id="niche" role="group" aria-labelledby="l1"></div></div>
  <div class="grp"><span class="lbl" id="l2">Platform</span><div class="chips" id="plat" role="group" aria-labelledby="l2"></div></div>
  
  <div class="grp"><div class="bud"><label class="lbl" for="bud">Budget per creator</label><b id="budv"></b></div><input type="range" id="bud" min="100" max="5000" step="100" value="1500"></div>
</div>

<h2 id="rt">Top matches</h2>
<div id="res" aria-live="polite"></div>

<div class="panel" id="shortlist" style="margin-top:26px">
  <h2>Your shortlist</h2>
  <div id="sl"></div>
</div>
</div>
<div id="vCamp" hidden><h2>Campaigns</h2><div id="camps"></div></div>
<p class="sub" style="margin:26px 0 0">Contact: <a href="mailto:elixerworks@gmail.com" style="color:var(--acc)">elixerworks@gmail.com</a></p>
</div>

<script>
var C=[
["DarkWebGamer","Darkwebgamer","SMP Content Creator","YouTube",85000,4.8,200,"+"],
["Leo Park","leopark.shorts","Short Creators","YouTube",210000,3.9,2600],
["Nia Okafor","nia.glows","Beauty","TikTok",140000,6.2,1400],
["Kai Tanaka","kaitech","Tech","YouTube",320000,3.1,3800],
["Sofia Marin","sofia.eats","Food","Instagram",64000,5.4,700],
["Aarav Mehta","aarav.wanders","Travel","Instagram",178000,3.6,2100],
["Zoe Hart","zoe.creates","Other Type Content Creator","TikTok",95000,7.1,1000],
["Imtiyano","imtiyano","Short Creators","Instagram",42000,6.8,900],
["Lena Fox","lenafox.beauty","Beauty","Instagram",260000,3.3,3200],
["Ben Ortiz","benbytes","Tech","TikTok",58000,5.9,650],
["Ivy Chen","ivycooks","Food","YouTube",120000,4.4,1500],
["Tara Quinn","tara.smp","SMP Content Creator","TikTok",230000,5.1,2900],
["Jay Brooks","jaybrooks.creates","Other Type Content Creator","YouTube",410000,2.8,4600],
["Mina Sato","minaontheroad","Travel","TikTok",72000,6.0,800]
];
var N=["SMP Content Creator","Short Creators","Other Type Content Creator"],P=["Any","Instagram","YouTube"],G=["Awareness","Sales"];
var S={niche:"SMP Content Creator",plat:"Any",goal:"Awareness",bud:1500},pick=[];
var cols=["#FF8FC7","#F5F26B","#9BD7FF","#B8F2C3","#FFC48A"];
try{var sv=localStorage.getItem("cm_short");if(sv)pick=JSON.parse(sv)||[]}catch(e){}
function save(){try{localStorage.setItem("cm_short",JSON.stringify(pick))}catch(e){}}
function $(id){return document.getElementById(id)}
function chips(id,arr,key){var el=$(id);el.innerHTML="";arr.forEach(function(v){var b=document.createElement("button");b.textContent=v;b.setAttribute("aria-pressed",S[key]===v);b.onclick=function(){S[key]=v;chips(id,arr,key);render()};el.appendChild(b)})}
function score(c){var s=0;
s+=c[2]===S.niche?45:10;
s+=(S.plat==="Any"||c[3]===S.plat)?20:0;
s+=c[6]<=S.bud?20:Math.max(0,20-(c[6]-S.bud)/S.bud*30);
var a=Math.min(c[4]/300000,1);
s+=a*15;
return Math.round(Math.max(0,Math.min(100,s)))}
function fmt(n){return n>=1000?(n/1000).toFixed(n%1000?1:0).replace(".0","")+"k":n}
function money(n){return "$"+n.toLocaleString("en-US")}
function render(){
$("budv").textContent=money(S.bud);
var r=C.map(function(c,i){return{c:c,i:i,s:score(c)}}).filter(function(x){return N.indexOf(x.c[2])>-1&&P.indexOf(x.c[3])>-1&&x.c[0]!=="Jay Brooks"&&x.c[0]!=="Leo Park"}).sort(function(a,b){return b.s-a.s}).slice(0,6);
$("res").innerHTML=r.map(function(x,k){var c=x.c,on=pick.indexOf(x.i)>-1;
return '<div class="cr"><div class="av" style="background:'+cols[x.i%5]+'">'+c[0].split(" ").map(function(w){return w[0]}).join("")+'</div>'+
'<div><h3>'+c[0]+'</h3><div class="meta">@'+c[1]+' · '+c[3]+'</div></div>'+
'<div class="sc">'+x.s+'%<small>match</small></div>'+
'<div class="meta">'+c[2]+' · '+fmt(c[4])+' followers · '+c[5]+'% engagement</div>'+
'<div class="bar" role="img" aria-label="Match score '+x.s+' percent"><i style="width:'+x.s+'%"></i></div>'+
'<div class="foot"><span class="price">'+money(c[6])+(c[7]||'')+' per post</span><button class="btn'+(on?' ghost':'')+'" data-i="'+x.i+'">'+(on?'Remove from shortlist':'Add to shortlist')+'</button></div></div>'}).join("");
document.querySelectorAll("#res .btn").forEach(function(b){b.onclick=function(){toggle(+b.dataset.i)}});
shortRender()}
function toggle(i){var k=pick.indexOf(i);if(k>-1)pick.splice(k,1);else pick.push(i);save();render()}
function shortRender(){var el=$("sl");
if(!pick.length){el.innerHTML='<p class="empty">No creators yet. Add some from the matches above.</p>';return}
var t=0;el.innerHTML=pick.map(function(i){var c=C[i];t+=c[6];return '<div class="sl"><div><b>'+c[0]+'</b><div class="meta">'+c[3]+' · '+money(c[6])+'</div></div><button class="btn ghost" data-r="'+i+'">Remove</button></div>'}).join("")+
'<div class="tot"><span>Total for one post each</span><span>'+money(t)+'</span></div>'+
'<button class="btn" id="mk" style="margin-right:8px">Start campaign</button><a class="btn ghost" href="mailto:mohit@cretrvip.is.best.net,elixerworks@gmail.com?subject='+encodeURIComponent("Creator shortlist")+'&body='+encodeURIComponent("Shortlist:\n"+pick.map(function(i){return C[i][0]+" (@"+C[i][1]+") - "+money(C[i][6])}).join("\n")+"\nTotal: "+money(t))+'">Send shortlist to Cretrvip</a>';
document.querySelectorAll("#sl [data-r]").forEach(function(b){b.onclick=function(){toggle(+b.dataset.r)}});var mk=$('mk');if(mk)mk.onclick=makeCamp}
$("bud").oninput=function(){S.bud=+this.value;render()};
var ST=['Briefed','Contracted','Content ready','Live','Paid'],camps=[];
try{var cv=localStorage.getItem('cm_camps');if(cv)camps=JSON.parse(cv)||[]}catch(e){}
function csave(){try{localStorage.setItem('cm_camps',JSON.stringify(camps))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function tab(t){$('vMatch').hidden=t!=='m';$('vCamp').hidden=t!=='c';$('tm').setAttribute('aria-pressed',t==='m');$('tc').setAttribute('aria-pressed',t==='c');if(t==='c')campRender()}
$('tm').onclick=function(){tab('m')};$('tc').onclick=function(){tab('c')};
function makeCamp(){var t=0;pick.forEach(function(i){t+=C[i][6]});camps.unshift({n:'Campaign '+(camps.length+1),b:Math.ceil(t*1.1/100)*100,it:pick.map(function(i){return{i:i,s:0}})});pick=[];save();csave();render();tab('c')}
function campRender(){var el=$('camps');
if(!camps.length){el.innerHTML='<p class="empty">No campaigns yet. Add creators to your shortlist on the Match tab, then choose Start campaign.</p>';return}
el.innerHTML=camps.map(function(c,k){var t=0,pd=0,pr=0;c.it.forEach(function(x){t+=C[x.i][6];pr+=x.s;if(x.s==4)pd+=C[x.i][6]});
var pct=c.it.length?Math.round(pr/(c.it.length*4)*100):0,over=t>c.b;
return '<div class="panel"><div class="ch"><input class="in" data-k="'+k+'" data-f="n" value="'+esc(c.n)+'" aria-label="Campaign name"><button class="btn ghost" data-d="'+k+'">Delete</button></div>'
+'<div class="bgt"><label for="b'+k+'">Budget $</label><input class="in" id="b'+k+'" type="number" min="0" step="100" data-k="'+k+'" data-f="b" value="'+c.b+'"></div>'
+'<div class="meta">Committed '+money(t)+' of '+money(c.b)+(over?' <span class="warn">Over budget by '+money(t-c.b)+'</span>':'')+'. Paid out '+money(pd)+'.</div>'
+'<div class="bar" role="img" aria-label="Progress '+pct+' percent"><i style="width:'+pct+'%"></i></div><div class="meta" style="margin-bottom:10px">'+pct+'% of work complete</div>'
+c.it.map(function(x,j){return '<div class="cl"><div><b>'+C[x.i][0]+'</b><div class="meta">'+C[x.i][3]+' · '+money(C[x.i][6])+'</div></div><select data-k="'+k+'" data-s="'+j+'" aria-label="Stage for '+C[x.i][0]+'">'+ST.map(function(s,n){return '<option value="'+n+'"'+(n==x.s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'}).join('')+'</div>'}).join('')}
$('camps').onchange=function(e){var t=e.target,k=+t.dataset.k;if(t.dataset.f==='n')camps[k].n=t.value;else if(t.dataset.f==='b')camps[k].b=Math.max(0,+t.value||0);else if(t.dataset.s!==undefined)camps[k].it[+t.dataset.s].s=+t.value;else return;csave();campRender()};
$('camps').onclick=function(e){var d=e.target.dataset.d;if(d!==undefined){camps.splice(+d,1);csave();campRender()}};
chips("niche",N,"niche");chips("plat",P,"plat");render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
